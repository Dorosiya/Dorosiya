name: Update profile summary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

permissions:
  contents: read

concurrency:
  group: profile-summary
  cancel-in-progress: false

jobs:
  generate-light:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate profile card
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Dorosiya
          UTC_OFFSET: 9
          AUTO_PUSH: false
          THEME: github
          ANIMATION: rise
          DURATION: 0.8
          NAME: SHYU

      - name: Upload generated card
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-summary-light
          path: profile-summary-card-output/github/0-profile-details.svg
          if-no-files-found: error

  generate-dark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate profile card
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Dorosiya
          UTC_OFFSET: 9
          AUTO_PUSH: false
          THEME: github_dark
          ANIMATION: rise
          DURATION: 0.8
          NAME: SHYU

      - name: Upload generated card
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-summary-dark
          path: profile-summary-card-output/github_dark/0-profile-details.svg
          if-no-files-found: error

  publish:
    needs:
      - generate-light
      - generate-dark
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Download light profile card
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-summary-light
          path: profile-summary-card-output/github

      - name: Download dark profile card
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-summary-dark
          path: profile-summary-card-output/github_dark

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: GitHub 프로필 시각화 갱신"
          git push origin HEAD:main
