name: Update profile summary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

permissions:
  contents: read

concurrency:
  group: profile-summary
  cancel-in-progress: false

jobs:
  generate-light:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate profile card
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Dorosiya
          UTC_OFFSET: 9
          AUTO_PUSH: false
          THEME: github
          ANIMATION: rise
          DURATION: 0.8
          NAME: SHYU

      - name: Upload generated card
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-summary-light
          path: profile-summary-card-output/github/0-profile-details.svg
          if-no-files-found: error

  generate-dark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate profile card
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Dorosiya
          UTC_OFFSET: 9
          AUTO_PUSH: false
          THEME: github_dark
          ANIMATION: rise
          DURATION: 0.8
          NAME: SHYU

      - name: Upload generated card
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-summary-dark
          path: profile-summary-card-output/github_dark/0-profile-details.svg
          if-no-files-found: error

  publish:
    needs:
      - generate-light
      - generate-dark
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download light profile card
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-summary-light
          path: profile-summary-card-output/github

      - name: Download dark profile card
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-summary-dark
          path: profile-summary-card-output/github_dark

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: GitHub 프로필 시각화 갱신"
          git push origin HEAD:main
